unbind C-b          # 取消默认的 Ctrl+b
set-option -g prefix C-a
bind-key C-a send-prefix

# 开启鼠标支持（可选）
set -g mouse on

# 允许使用方向键切换窗格
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 分屏快捷键
bind | split-window -h   # 水平分屏
bind - split-window -v   # 垂直分屏

# 重新加载配置文件
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# 显示窗格编号（便于切换）
set -g display-panes-time 1000
set -g display-panes-colour "#859289"
set -g display-panes-active-colour "#e67e80"

# 开启 256 色支持
set -g default-terminal "screen-256color"
set -g @plugin 'tmux-plugins/tpm'

# 添加 fzf 绑定插件
set -g @plugin 'joshmedeski/tmux-fzf-bindings'

# ── Everforest Dark 配色（手写，替代 catppuccin/tmux 插件）──
# 色板：bg0 #272E33 | bg1 #2D353B | bg2 #343F44 | bg4 #475258
#       fg #D3C6AA | gray #859289 | red #E67E80 | green #A7C080
#       yellow #DBBC7F | blue #7FBBB3 | cyan #83C092 | purple #D699B6

# 状态栏整体
set -g status-style "bg=#272e33,fg=#d3c6aa"
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#[bg=#7fbbb3,fg=#272e33,bold] #S #[bg=#272e33,fg=#7fbbb3]█"
set -g status-right "#[bg=#343f44,fg=#d3c6aa] %H:%M %d-%b-%y #[bg=#272e33,fg=#343f44]█"

# 窗口列表
set -g window-status-separator ""
set -g window-status-format "#[fg=#859289,bg=#2d353b] #I:#W "
set -g window-status-current-format "#[fg=#272e33,bg=#a7c080,bold] #I:#W #[fg=#272e33,bg=#272e33]"
set -g window-status-activity-style "fg=#dbbc7f,bg=#2d353b"
set -g window-status-bell-style "fg=#272e33,bg=#e67e80,bold"

# 窗格边框
set -g pane-border-style "fg=#475258"
set -g pane-active-border-style "fg=#7fbbb3"

# 消息 / 模式
set -g message-style "bg=#343f44,fg=#d3c6aa"
set -g message-command-style "bg=#343f44,fg=#d3c6aa"
set -g mode-style "bg=#475258,fg=#d3c6aa"
set -g clock-mode-colour "#7fbbb3"

# Keep this line at the very bottom of tmux.conf
run '~/.tmux/plugins/tpm/tpm'

